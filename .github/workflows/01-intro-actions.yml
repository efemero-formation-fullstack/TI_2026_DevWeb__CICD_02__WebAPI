name: 01 - Intro aux actions

on:
  workflow_dispatch:

jobs:
  test_project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: List files
        run: ls -la
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install ci
      - name: Launch tests
        run: npm run test:run

  build_project:
    needs: test_project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install ci
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: dist
          if-no-files-found: error

  deploy_project:
    needs: build_project
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: build
          path: webapi
      - name: View files
        run: ls -la webapi
